name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:source
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-that-is-long-enough
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-that-is-long-enough
          LIVEKIT_URL: wss://example.livekit.cloud
          LIVEKIT_API_KEY: test-key
          LIVEKIT_API_SECRET: test-livekit-secret-that-is-long-enough
